name: Update Neovim Plugins

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        uses: rhysd/action-setup-vim@47493751bcbf7a4b12bc9e0c2ddce7aa1e3b69e5 # v1.4.1
        with:
          neovim: true
          version: stable

      - name: Update plugins
        run: nvim --headless "+Lazy! update" +qa
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.config

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: update neovim plugins"
          title: "chore: update neovim plugins"
          body: |
            Automated weekly update of Neovim plugins via lazy.nvim.

            Changes are reflected in `.config/nvim/lazy-lock.json`.
          branch: "auto/update-nvim-plugins"
          delete-branch: true
          labels: "dependencies"

      - name: Enable Auto-Merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
