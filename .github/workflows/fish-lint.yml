name: Fish Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fish-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install fish
        run: sudo apt-get install -y fish

      - name: Check fish syntax
        run: make fish-lint
